[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/payment/create"
  to = "/.netlify/functions/create"
  status = 200

[[redirects]]
  from = "/api/payment/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/api/payment/verify"
  to = "/.netlify/functions/verify"
  status = 200

[[redirects]]
  from = "/modules/gateways/callback/jonotapay.php"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
